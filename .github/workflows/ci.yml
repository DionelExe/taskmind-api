name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Validate application contract
        run: |
          python - <<'PY'
          from main import app

          paths = app.openapi()["paths"]
          assert paths["/api/v1/tasks/"]["post"]["responses"]["201"]
          assert paths["/api/v1/tasks/"]["get"]["responses"]["200"]
          print("API contract validated")
          PY

  analyze:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: python -m ruff check .

      - name: Compile Python files
        run: python -m compileall -q app notification_service main.py get_token.py locustfile.py

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  container:
    runs-on: ubuntu-latest
    needs: [test, analyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag taskmind-api:${{ github.sha }} .