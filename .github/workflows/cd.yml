name: Continuous Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE_NAME: taskmind-api
    steps:
      - name: Check deployment credentials
        id: configuration
        shell: bash
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GCP_SA_KEY is not configured; deployment skipped."
          fi

      - name: Checkout
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: steps.configuration.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.configuration.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.configuration.outputs.configured == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and publish image
        if: steps.configuration.outputs.configured == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}"
          docker build --tag "${IMAGE}:latest" --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        if: steps.configuration.outputs.configured == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --quiet
